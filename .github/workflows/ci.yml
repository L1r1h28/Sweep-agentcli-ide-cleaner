name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Run tests
        run: npm test --workspaces --if-present

  build-binaries:
    name: Build SEA Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sweep-linux-x64
          - os: windows-latest
            artifact: sweep-win-x64.exe
          - os: macos-latest
            artifact: sweep-macos
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI bundle
        run: npm run build --workspace=@l1r1h28/sweep-core --workspace=@l1r1h28/sweep-cli

      - name: Build SEA binary
        run: node scripts/build-binary.mjs
        working-directory: packages/cli

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/dist/sweep-*
          if-no-files-found: error
          retention-days: 7

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksums
          path: packages/cli/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7