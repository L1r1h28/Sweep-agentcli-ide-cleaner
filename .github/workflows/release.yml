name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本號（例如 1.1.3，不要加 v）'
        required: true
        type: string
      draft:
        description: '建立為草稿 (true/false)'
        required: false
        type: boolean
        default: false
      publish_stores:
        description: '發布至各大商店 (VS Code Marketplace, Open VSX, npm)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-cli-binaries:
    name: Build CLI binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cli-linux-x64
          - os: windows-latest
            artifact: cli-windows-x64
          - os: macos-latest
            artifact: cli-darwin-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: |
          npm pkg set version=${{ inputs.version }} --workspace=@l1r1h28/sweep-core --no-git-tag-version
          npm pkg set version=${{ inputs.version }} --workspace=@l1r1h28/sweep-cli --no-git-tag-version

      - name: Build CLI bundle
        run: |
          npm run build --workspace=@l1r1h28/sweep-core
          npm run build --workspace=@l1r1h28/sweep-cli

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Build SEA binary
        working-directory: packages/cli
        run: node scripts/build-binary.mjs

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/cli/dist/sweep-*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release & Store Packages
    needs: build-cli-binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect binaries & calculate checksums
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "sweep-*" ! -name "*.blob" ! -name "*.cjs" ! -name "*.map" \) -exec cp {} dist/ \;
          cd dist
          chmod +x sweep-linux-x64 sweep-darwin-arm64 sweep-darwin-x64 2>/dev/null || true
          sha256sum sweep-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      - name: Extract release notes from CHANGELOG.md
        run: |
          node scripts/extract-release-notes.mjs ${{ inputs.version }}
          cat RELEASE_NOTES_BODY.md

      - name: Setup Node for extension packaging
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & package VS Code extension
        run: |
          npm ci
          npm run build --workspace=sweep-aicleaner
          cd packages/vscode-extension
          npm pkg set version=${{ inputs.version }} --no-git-tag-version
          npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository --out ../../dist/sweep-aicleaner-${{ inputs.version }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }} — Sweep AI Cleaner
          body_path: RELEASE_NOTES_BODY.md
          fail_on_unmatched_files: false
          files: |
            dist/sweep-*
            dist/SHA256SUMS.txt
          draft: ${{ inputs.draft }}
          prerelease: false

      # --- Store Publishing Pipeline ---
      - name: Publish to VS Code Marketplace
        if: ${{ inputs.publish_stores && !inputs.draft }}
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning title=VSCE_PAT Missing::VSCE_PAT secret not found, skipping VS Code Marketplace publishing."
          else
            echo "Publishing VSIX to VS Code Marketplace..."
            npx --yes @vscode/vsce publish --packagePath dist/sweep-aicleaner-${{ inputs.version }}.vsix -p "$VSCE_PAT" || echo "::warning title=VSCE Publish Failed::Failed to publish to VS Code Marketplace (check PAT token permissions)."
          fi

      - name: Publish to Open VSX Registry
        if: ${{ inputs.publish_stores && !inputs.draft }}
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning title=OVSX_PAT Missing::OVSX_PAT secret not found, skipping Open VSX publishing."
          else
            echo "Publishing VSIX to Open VSX Registry..."
            npx --yes ovsx publish dist/sweep-aicleaner-${{ inputs.version }}.vsix -p "$OVSX_PAT" || echo "::warning title=OVSX Publish Failed::Failed to publish to Open VSX (check PAT token permissions)."
          fi

      - name: Publish packages to npm Registry
        if: ${{ inputs.publish_stores && !inputs.draft }}
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning title=NPM_TOKEN Missing::NPM_TOKEN secret not found, skipping npm packages publishing."
          else
            echo "Setting up npm authentication..."
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
            echo "Publishing @l1r1h28/sweep-core to npm..."
            npm publish --workspace=@l1r1h28/sweep-core --access public || echo "::warning title=npm publish core failed::Failed to publish @l1r1h28/sweep-core to npm."
            echo "Publishing @l1r1h28/sweep-cli to npm..."
            npm publish --workspace=@l1r1h28/sweep-cli --access public || echo "::warning title=npm publish cli failed::Failed to publish @l1r1h28/sweep-cli to npm."
          fi
