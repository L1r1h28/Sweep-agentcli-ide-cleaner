name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本號（例如 0.4.0，不要加 v）'
        required: true
        type: string
      draft:
        description: '建立為草稿 (true/false)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-cli-binaries:
    name: Build CLI binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cli-linux-x64
          - os: windows-latest
            artifact: cli-windows-x64
          - os: macos-latest
            artifact: cli-darwin-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: |
          npm pkg set version=${{ inputs.version }} --workspace=@aicleaner/core --no-git-tag-version
          npm pkg set version=${{ inputs.version }} --workspace=@aicleaner/cli --no-git-tag-version

      - name: Build CLI bundle
        run: |
          npm run build --workspace=@aicleaner/core
          npm run build --workspace=@aicleaner/cli

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Build SEA binary
        working-directory: packages/cli
        run: node scripts/build-binary.mjs

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/cli/dist/sweep-*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-cli-binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect binaries & calculate checksums
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "sweep-*" ! -name "*.blob" ! -name "*.cjs" ! -name "*.map" \) -exec cp {} dist/ \;
          cd dist
          chmod +x sweep-linux-x64 sweep-darwin-arm64 sweep-darwin-x64 2>/dev/null || true
          sha256sum sweep-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const version = '${{ inputs.version }}';
            const escaped = version.replace(/\./g, '\\.');
            const regex = new RegExp('## \\\[' + escaped + '\\\][^\\\n]*\\\n([\\\s\\\S]*?)(?=\\\n## \\\[|$)', 'm');
            const match = content.match(regex);
            const notes = match ? match[1].trim() : '# Sweep v' + version;
            fs.writeFileSync('RELEASE_NOTES_BODY.md', notes);
          "
          cat RELEASE_NOTES_BODY.md

      - name: Setup Node for extension packaging
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & package VS Code extension
        run: |
          npm ci
          npm run build --workspace=sweep-aicleaner
          cd packages/vscode-extension
          npm pkg set version=${{ inputs.version }} --no-git-tag-version
          npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository --out ../../dist/sweep-aicleaner-${{ inputs.version }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }} — Sweep AI Cleaner
          body_path: RELEASE_NOTES_BODY.md
          fail_on_unmatched_files: false
          files: |
            dist/sweep-*
            dist/SHA256SUMS.txt
          draft: ${{ inputs.draft }}
          prerelease: false
